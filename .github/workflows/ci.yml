name: CI

# Scope note: this workflow mirrors the LOCAL xp-gate pre-commit gates that can
# run in a clean process (Pester full suite + PSScriptAnalyzer) and adds the
# coverage threshold (80%) so the local-only gate is not the single line of
# defense. Gates that need interactive/admin tooling (drill5 UAC, sprint-flow
# state) remain local-only by design.
#
# Flaky-run policy: the suite is hermetic, but AGENTS.md records one
# unreproduced environment-level flake (720/1 under pwsh). If a CI run fails
# with no related change, re-run once before investigating.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell:
    name: Pester + coverage + PSSA (${{ matrix.engine }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7

      - name: Encoding guard (non-ASCII .ps1 must be UTF-8 with BOM)
        # Windows PowerShell 5.1 reads BOM-less files in the system ANSI
        # codepage (CP1252 on runners): UTF-8 Chinese in test files becomes
        # mojibake and can even break parsing (observed in CI run #1). All
        # product scripts already carry a BOM; this keeps it that way.
        # Placed BEFORE module installs so an encoding regression fails fast.
        run: |
          $bad = Get-ChildItem -Recurse -Filter *.ps1 -File |
            Where-Object { $_.FullName -notmatch '\\\.git\\' } |
            Where-Object {
              $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
              $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
              $hasNonAscii = $false
              foreach ($b in $bytes) { if ($b -gt 0x7F) { $hasNonAscii = $true; break } }
              -not $hasBom -and $hasNonAscii
            }
          if ($bad) {
            $bad.FullName | ForEach-Object { Write-Output "Missing BOM with non-ASCII content: $_" }
            exit 1
          }
          Write-Output 'Encoding guard: all non-ASCII .ps1 files carry a UTF-8 BOM'

      - name: Install Pester + PSScriptAnalyzer
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -MinimumVersion 1.21.0 -Force -Scope CurrentUser
          # Explicit import: windows-latest ships Pester 3.4.0 in $PSHOME, and
          # implicit version resolution may pick it over the installed 5.x.
          Import-Module Pester -MinimumVersion 5.5.0 -Force
          Import-Module PSScriptAnalyzer -MinimumVersion 1.21.0 -Force

      - name: Run Pester suite with coverage gate (>= 80%)
        run: |
          # GitHub Actions' powershell/pwsh wrapper prepends
          # $ErrorActionPreference = 'stop' to every run step. The suite's
          # error-path tests call Main() in-process and capture its
          # non-terminating Write-Error via 2>&1; under 'stop' those become
          # terminating and fail the tests (observed in CI run #1). Restore
          # the semantics of a clean local run.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false # no-op on PS 5.1
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Normal'
          # Same denominator as the local xp-gate coverage gate: product code
          # only. The authoritative scope is .xp-gate-powershell-analysis-paths
          # (kept consistent with tracked reality by the platform-hygiene
          # '门禁边界一致性' tests); scratch/drill directories leave discovery
          # via .xp-gate-powershell-prune-dirs — they are NOT subtracted from
          # the denominator here (coverage-ignore is intentionally empty).
          $scope = @(Get-Content .xp-gate-powershell-analysis-paths |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') })
          if ($scope.Count -eq 0) { Write-Output 'FAILED: empty analysis-paths scope'; exit 1 }
          $cfg.CodeCoverage.Enabled = $true
          $cfg.CodeCoverage.Path = $scope
          $cfg.CodeCoverage.OutputFormat = 'JaCoCo'
          $cfg.CodeCoverage.OutputPath = 'coverage-ci.xml'
          Invoke-Pester -Configuration $cfg
          # Metric alignment: the local xp-gate gate measures LINE coverage
          # from the report-level LINE counter of the JaCoCo report. Two
          # traps observed in CI run #3: Pester's returned
          # .CodeCoverage.CoveragePercent is (a) COMMAND coverage, not line
          # coverage, and (b) unreliable under Run.Exit=$true (reported 0
          # while Pester's own output printed the correct figure). Parse the
          # XML the same way the local adapter does.
          [xml]$cov = Get-Content coverage-ci.xml
          $line = $cov.report.counter | Where-Object { $_.type -eq 'LINE' }
          $covered = [int]$line.covered
          $total = $covered + [int]$line.missed
          $pct = [math]::Round(100 * $covered / $total, 2)
          Write-Output "Line coverage: $pct% ($covered/$total)"
          if ($pct -lt 80) {
            Write-Output "FAILED: line coverage $pct% is below the 80% threshold"
            exit 1
          }

      - name: PSScriptAnalyzer (must be 0 findings)
        run: |
          $findings = @()
          # Same authoritative scope as the coverage step:
          # .xp-gate-powershell-analysis-paths (consistency enforced by the
          # platform-hygiene tests). Directories are scanned recursively,
          # single files directly.
          $scope = @(Get-Content .xp-gate-powershell-analysis-paths |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') })
          foreach ($p in $scope) {
            if (-not (Test-Path -LiteralPath $p)) {
              Write-Output "FAILED: analysis-paths entry does not exist: $p"
              exit 1
            }
            # @() + Invoke-ScriptAnalyzer would append a single $null on a clean
            # run ("@() + $null" yields a 1-element array), making "0 findings"
            # fail closed in the wrong direction. Guard instead.
            $r = Invoke-ScriptAnalyzer -Path $p -Recurse:$([System.IO.Directory]::Exists($p)) -Settings PSScriptAnalyzerSettings.psd1
            if ($r) { $findings += @($r) }
          }
          if ($findings.Count -gt 0) {
            $findings | Format-Table -AutoSize | Out-String | Write-Output
            exit 1
          }
          Write-Output 'PSScriptAnalyzer: 0 findings'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.engine }}
          path: coverage-ci.xml
          if-no-files-found: ignore

  package:
    # Builds the distributable skill package and asserts the CLI/UI split holds.
    #
    # Why this is a separate job rather than a step in `powershell`: the split is a
    # RELEASE property, not a test property. `ui/server` spawns admin-privileged
    # destructive PowerShell, so "the cleaner package does not contain it" has to be
    # enforced on every push -- otherwise the first time anyone notices a bad split
    # is after it has been handed to colleagues.
    #
    # Runs on ONE engine only: the packager calls Remove-Item/Copy-Item and its
    # behaviour does not vary by engine, and the cross-engine Pester matrix above
    # already covers the scripts it copies.
    name: Skill package (CLI/UI split)
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Build packages
        run: ./tools/New-SkillPackage.ps1 -OutputRoot ./dist

      - name: Assert the skill package excludes the privileged server
        # Fail-closed: if this list ever has to be relaxed, that is a design change
        # requiring review, not a CI tweak.
        run: |
          $skill = './dist/windows-residual-cleaner-skill'
          if (-not (Test-Path "$skill/references/scripts/run-all.ps1")) {
            throw 'skill package is missing the pipeline (packaging step produced nothing)'
          }
          $forbidden = @('ui', 'ui/server', 'tests', 'tools', 'githooks', 'node_modules')
          $leaks = @($forbidden | Where-Object { Test-Path (Join-Path $skill $_) })
          if ($leaks.Count -gt 0) {
            throw "skill package leaked privileged/dev directories: $($leaks -join ', ')"
          }
          $scriptCount = @(Get-ChildItem "$skill/references/scripts" -Filter *.ps1 -File).Count
          if ($scriptCount -ne 17) {
            throw "expected 17 pipeline scripts in the skill package, found $scriptCount"
          }
          Write-Output "skill package OK: 17 scripts, no ui/ or dev infra"

      - name: Upload skill package
        uses: actions/upload-artifact@v7
        with:
          name: skill-package
          path: dist/windows-residual-cleaner-skill/
          if-no-files-found: error
          retention-days: 30

  ui:
    name: UI (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npx vitest run
