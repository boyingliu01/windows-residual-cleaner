name: CI

# Scope note: this workflow mirrors the LOCAL xp-gate pre-commit gates that can
# run in a clean process (Pester full suite + PSScriptAnalyzer) and adds the
# coverage threshold (80%) so the local-only gate is not the single line of
# defense. Gates that need interactive/admin tooling (drill5 UAC, sprint-flow
# state) remain local-only by design.
#
# Flaky-run policy: the suite is hermetic, but AGENTS.md records one
# unreproduced environment-level flake (720/1 under pwsh). If a CI run fails
# with no related change, re-run once before investigating.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell:
    name: Pester + coverage + PSSA (${{ matrix.engine }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4

      - name: Encoding guard (non-ASCII .ps1 must be UTF-8 with BOM)
        # Windows PowerShell 5.1 reads BOM-less files in the system ANSI
        # codepage (CP1252 on runners): UTF-8 Chinese in test files becomes
        # mojibake and can even break parsing (observed in CI run #1). All
        # product scripts already carry a BOM; this keeps it that way.
        # Placed BEFORE module installs so an encoding regression fails fast.
        run: |
          $bad = Get-ChildItem -Recurse -Filter *.ps1 -File |
            Where-Object { $_.FullName -notmatch '\\\.git\\' } |
            Where-Object {
              $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
              $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
              $hasNonAscii = $false
              foreach ($b in $bytes) { if ($b -gt 0x7F) { $hasNonAscii = $true; break } }
              -not $hasBom -and $hasNonAscii
            }
          if ($bad) {
            $bad.FullName | ForEach-Object { Write-Output "Missing BOM with non-ASCII content: $_" }
            exit 1
          }
          Write-Output 'Encoding guard: all non-ASCII .ps1 files carry a UTF-8 BOM'

      - name: Install Pester + PSScriptAnalyzer
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -MinimumVersion 1.21.0 -Force -Scope CurrentUser
          # Explicit import: windows-latest ships Pester 3.4.0 in $PSHOME, and
          # implicit version resolution may pick it over the installed 5.x.
          Import-Module Pester -MinimumVersion 5.5.0 -Force
          Import-Module PSScriptAnalyzer -MinimumVersion 1.21.0 -Force

      - name: Run Pester suite (727 tests) with coverage gate (>= 80%)
        run: |
          # GitHub Actions' powershell/pwsh wrapper prepends
          # $ErrorActionPreference = 'stop' to every run step. The suite's
          # error-path tests call Main() in-process and capture its
          # non-terminating Write-Error via 2>&1; under 'stop' those become
          # terminating and fail the tests (observed in CI run #1). Restore
          # the semantics of a clean local run.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false # no-op on PS 5.1
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Normal'
          # Same denominator as the local xp-gate coverage gate: product code
          # only (references/scripts + setup.ps1). Drill/review tooling is
          # excluded locally via .xp-gate-powershell-coverage-ignore and is
          # simply not included here.
          $cfg.CodeCoverage.Enabled = $true
          $cfg.CodeCoverage.Path = @('references/scripts/*.ps1', 'setup.ps1')
          $cfg.CodeCoverage.OutputFormat = 'JaCoCo'
          $cfg.CodeCoverage.OutputPath = 'coverage-ci.xml'
          Invoke-Pester -Configuration $cfg
          # Metric alignment: the local xp-gate gate measures LINE coverage
          # from the report-level LINE counter of the JaCoCo report. Two
          # traps observed in CI run #3: Pester's returned
          # .CodeCoverage.CoveragePercent is (a) COMMAND coverage, not line
          # coverage, and (b) unreliable under Run.Exit=$true (reported 0
          # while Pester's own output printed the correct figure). Parse the
          # XML the same way the local adapter does.
          [xml]$cov = Get-Content coverage-ci.xml
          $line = $cov.report.counter | Where-Object { $_.type -eq 'LINE' }
          $covered = [int]$line.covered
          $total = $covered + [int]$line.missed
          $pct = [math]::Round(100 * $covered / $total, 2)
          Write-Output "Line coverage: $pct% ($covered/$total)"
          if ($pct -lt 80) {
            Write-Output "FAILED: line coverage $pct% is below the 80% threshold"
            exit 1
          }

      - name: PSScriptAnalyzer (must be 0 findings)
        run: |
          $findings = @()
          # @() + Invoke-ScriptAnalyzer would append a single $null on a clean
          # run ("@() + $null" yields a 1-element array), making "0 findings"
          # fail closed in the wrong direction. Guard instead.
          $r1 = Invoke-ScriptAnalyzer -Path references/scripts -Recurse -Settings PSScriptAnalyzerSettings.psd1
          if ($r1) { $findings += @($r1) }
          $r2 = Invoke-ScriptAnalyzer -Path setup.ps1 -Settings PSScriptAnalyzerSettings.psd1
          if ($r2) { $findings += @($r2) }
          if ($findings.Count -gt 0) {
            $findings | Format-Table -AutoSize | Out-String | Write-Output
            exit 1
          }
          Write-Output 'PSScriptAnalyzer: 0 findings'

  ui:
    name: UI (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npx vitest run
