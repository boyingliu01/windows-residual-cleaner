name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  powershell:
    name: Pester + PSSA (${{ matrix.engine }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester + PSScriptAnalyzer
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run Pester suite (727 tests)
        run: |
          $pconfig = New-PesterConfiguration
          $pconfig.Run.Path = 'tests'
          $pconfig.Run.Exit = $true
          $pconfig.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $pconfig

      - name: PSScriptAnalyzer (must be 0 findings)
        run: |
          $findings = @()
          $findings += Invoke-ScriptAnalyzer -Path references/scripts -Recurse -Settings PSScriptAnalyzerSettings.psd1
          $findings += Invoke-ScriptAnalyzer -Path setup.ps1 -Settings PSScriptAnalyzerSettings.psd1
          if ($findings.Count -gt 0) {
            $findings | Format-Table -AutoSize | Out-String | Write-Output
            exit 1
          }
          Write-Output 'PSScriptAnalyzer: 0 findings'

  ui:
    name: UI (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npx vitest run
